behaviors:
  CombatAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024 #512
      buffer_size: 8192 # Increased Data
      learning_rate: 5.0e-4 #1.0e-4 #3.0e-4
      beta: 1.0e-2 # More Explore
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256 # 19 Observation -> more layer
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000 #3M Steps
    time_horizon: 256 # 5 seconds for counter or guard timer
    summary_freq: 10000
    checkpoint_interval: 50000