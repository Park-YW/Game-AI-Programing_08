behaviors:
  CombatAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192 # 데이터 양 늘려봄
      learning_rate: 3.0e-4
      beta: 1.0e-2 # 초기에 더 다양한 행동 무작위 탐색
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256 # 관측값 종류가 19개이므로 좀 키움
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000 #300만스텝
    time_horizon: 256 # 카운터 어택 유효시간 1.5초 -> 연동성을 위해 5초까지 늘림
    summary_freq: 10000
    checkpoint_interval: 50000